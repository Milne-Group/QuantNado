name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        ref: ${{ github.event.release.tag_name }}

    - uses: astral-sh/setup-uv@v2

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Derive release version
      id: release-version
      run: |
        tag="${{ github.event.release.tag_name }}"
        version="${tag#v}"
        if [ -z "$version" ] || [ "$version" = "$tag" ]; then
          echo "Release tag must look like v0.4.7; got '$tag'." >&2
          exit 1
        fi
        echo "version=$version" >> "$GITHUB_OUTPUT"

    - name: Build package
      env:
        SETUPTOOLS_SCM_PRETEND_VERSION_FOR_QUANTNADO: ${{ steps.release-version.outputs.version }}
      run: uv build

    - name: Check built version
      run: |
        version="${{ steps.release-version.outputs.version }}"
        test -f "dist/quantnado-${version}.tar.gz"
        test -f "dist/quantnado-${version}-py3-none-any.whl"

    - name: Publish package
      uses: pypa/gh-action-pypi-publish@release/v1
