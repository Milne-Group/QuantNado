[build-system]
requires = [
    "setuptools >=82",
    "wheel",
    "setuptools_scm[toml]>=9.2.2",
]
build-backend = "setuptools.build_meta"

[project]
name = "quantnado"
description = "Dataset generation and peak calling for multi-modal Next-Generation Sequencing data"
authors = [
    { name = "Catherine Chahrour", email = "catherine.chahrour@imm.ox.ac.uk" },
    { name = "Alastair Smith", email = "alastair.smith@imm.ox.ac.uk" },
]
readme = "README.md"
requires-python = ">=3.12, <3.14"
license = "GPL-3.0-only"
dynamic = ["version"]

dependencies = [
    "bamnado==0.6.1",
    "dask-ml>=2025,<2027",
    "dask==2026.3.0",
    "loguru>=0.7",
    "matplotlib==3.10.9",
    "numpy>=2,<=2.4.5",
    "pandas>=2,<4.0.0",
    "pyBigWig>=0.3",
    "pyranges1>=1.0",
    "pysam>=0.23",
    "scikit-allel>=1.3",
    "seaborn>=0.13",
    "sparse>=0.18",
    "tqdm>=4.67",
    "typer>=0.24",
    "xarray>=2026",
    "zarr>=3.1.5,<4.0",
    "plotnado>=0.3",
    "pytest>=9.0.2",
    "pydeseq2>=0.5.4",
]

[project.optional-dependencies]
numba = [
    "numba>=0.59",
]
lanceotron = [
    "torch==2.11.0",
    "scipy>=1.10",
]
gpu = [
    "torch>=2.0",
]
dev = [
    "mkdocs-material==9.7.6",
    "mkdocs>=1.6,<2.0",
    "mkdocs-jupyter==0.26.3",
    "mkdocstrings-python==2.0.3",
    "mkdocstrings==1.0.4",
    "pymdown-extensions==10.21",
    "pytest==9.0.3",
    "pytest-cov==7.1.0",
    "pytest-xdist>=3.0",
    "ruff==0.15.12",
]
example = [
    "ipykernel>6.0.0,<7.4.0",
    "jupyterlab==4.5.7",
]

[project.scripts]
quantnado = "quantnado.cli:main"
quantnado-make-zarr = "quantnado.cli:make_zarr_main"
quantnado-combine-metadata = "quantnado.cli:combine_metadata_main"

[tool.setuptools_scm]
write_to = "quantnado/_version.py"
local_scheme = "no-local-version"
fallback_version = "0.0.0"

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
"quantnado.peak_calling.static.lanceotron" = ["*.pt", "*.npy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "unit: fast, self-contained unit tests (no BamStore or file I/O)",
    "integration: tests that require a BamStore or file system",
    "cli: tests for the command-line interface",
]

[tool.ruff]
line-length = 100
target-version = "py312"

